name: Linux Port Nightly

# Fork-only: keeps the `linux` branch merged with upstream master and publishes unsigned
# Windows and Linux builds of it as a GitHub pre-release (fork-nightly.yml does the work).
# Scheduled and manual runs use the copy of this file on the fork's default branch.

on:
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: linux-port-nightly
  cancel-in-progress: false

jobs:
  nightly:
    uses: ./.github/workflows/fork-nightly.yml
    secrets: inherit
    with:
      branch: linux
      follow-url: https://github.com/Nexus-Mods/Vortex.git
      follow-ref: master
      prefix: nightly
      title: Linux port
